<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Effects Demo</h1>

    <div class="card hover-effect">
        <h2>Hover Effect</h2>
        <p>This box grows and changes color when you hover over it.</p>
    </div>

    <div class="card shadow-effect">
        <h2>Shadow Effect</h2>
        <p>This box has a smooth shadow transition.</p>
    </div>

    <div class="card rotate-effect">
        <h2>Rotate Effect</h2>
        <p>This box rotates slightly when hovered.</p>
    </div>

</body>
</html>
